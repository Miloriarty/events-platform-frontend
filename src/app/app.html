<mat-toolbar class="app-toolbar">
  @if (isHandset()) {
    <button matIconButton aria-label="Меню" (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="brand" routerLink="/events">
    <mat-icon>celebration</mat-icon>
    <span>Events Platform</span>
  </a>
  <span class="spacer"></span>

  @if (auth.user(); as user) {
    <button matButton [matMenuTriggerFor]="userMenu" class="user-button">
      <mat-icon>account_circle</mat-icon>
      {{ user.username }}
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before">
      <div class="menu-header">
        <div class="menu-name">{{ user.username }}</div>
        <div class="menu-role">{{ roleLabel() }}</div>
      </div>
      <mat-divider />
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Выйти</span>
      </button>
    </mat-menu>
  } @else {
    <a matButton routerLink="/login">Войти</a>
    <a matButton="filled" routerLink="/register">Регистрация</a>
  }
</mat-toolbar>

<mat-sidenav-container class="app-container">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <mat-nav-list>
      @for (item of nav(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
